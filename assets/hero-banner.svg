<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
    <radialGradient id="glow1" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />
  <rect width="1200" height="320" rx="16" fill="url(#glow1)" />
  <rect width="1200" height="320" rx="16" fill="url(#glow2)" />

  <!-- Top Accent Line -->
  <rect x="60" y="0" width="1080" height="3" fill="url(#accent)" opacity="0.85" />

  <!-- Left Content: Name & Title -->
  <g transform="translate(60, 56)">
    <!-- Terminal Prompt Pill -->
    <rect x="0" y="0" width="290" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#22c55e" />
    <text x="30" y="18.5" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" font-weight="600">alhassan@systems-architect:~$</text>

    <!-- Main Name -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Alhassan Mohamed
    </text>

    <!-- Role Subtitle -->
    <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="url(#accent)">
      Full-Stack Software Engineer · Infrastructure Architect · Data Engineering Instructor
    </text>

    <!-- Description -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#94a3b8">
      Building production-grade enterprise platforms, bare-metal DCIM &amp; cloud infrastructure,
    </text>
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#94a3b8">
      low-latency Linux &amp; hardware-bridge tooling, and Data Engineering curricula.
    </text>

    <!-- Bottom Pill Badges -->
    <g transform="translate(0, 198)">
      <rect x="0" y="0" width="188" height="32" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <text x="94" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">⚡ FastAPI · Django · Next.js</text>

      <rect x="200" y="0" width="196" height="32" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <text x="298" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#818cf8">🐳 Docker · Linux · DevOps</text>

      <rect x="408" y="0" width="215" height="32" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <text x="515.5" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c084fc">📊 Data Engineering · ITI / HTI</text>
    </g>
  </g>

  <!-- Right Content: Terminal / Architecture Card -->
  <g transform="translate(770, 44)">
    <rect x="0" y="0" width="370" height="232" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.2" opacity="0.95" />
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="185" y="22" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">profile.yaml — zsh</text>
    <line x1="0" y1="34" x2="370" y2="34" stroke="#1e293b" stroke-width="1" />

    <!-- Code Content -->
    <g transform="translate(20, 58)" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12.5">
      <text x="0" y="0" fill="#38bdf8">engineer:</text>
      <text x="16" y="22" fill="#94a3b8">name: <tspan fill="#e2e8f0">"Alhassan Mohamed"</tspan></text>
      <text x="16" y="44" fill="#94a3b8">education: <tspan fill="#e2e8f0">"B.Sc. Physics &amp; CS"</tspan></text>
      <text x="16" y="66" fill="#94a3b8">focus:</text>
      <text x="28" y="88" fill="#a5b4fc">- Full-Stack &amp; Enterprise ERP/DCIM</text>
      <text x="28" y="108" fill="#a5b4fc">- Self-Hosted Cloud &amp; Homelab</text>
      <text x="28" y="128" fill="#a5b4fc">- Linux &amp; Hardware-Bridge Tooling</text>
      <text x="28" y="148" fill="#a5b4fc">- Data Engineering &amp; Teaching</text>
      <text x="16" y="168" fill="#94a3b8">repositories: <tspan fill="#4ade80" font-weight="700">100+ Public &amp; Private</tspan></text>
    </g>
  </g>
</svg>
